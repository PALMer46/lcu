name: Build LCU site from Google Sites
# Manual only: run from the Actions tab when Google Sites content changes.
# (Automatic runs on push were removed so site upgrades are never overwritten.)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml pillow
      - name: Scrape pages and convert images to WebP
        run: |
          rm -rf img
          python tools/scrape.py "$RUNNER_TEMP/raw.json" img
      - name: Build data.json
        run: python tools/build.py "$RUNNER_TEMP/raw.json" data.json
      - name: Commit
        run: |
          git config user.name "lcu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img data.json
          git commit -m "Build site data and images from Google Sites" || echo "nothing to commit"
          git push
