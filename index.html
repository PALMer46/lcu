<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOW CLASS UNIVERSE &#183; สารานุกรม LCU</title>
<meta name="description" content="สารานุกรมจักรวาล LOW CLASS UNIVERSE (LCU) &#8212; ตัวละคร กลุ่ม & องค์กร โลก เทคโนโลยี และไทม์ไลน์">
<meta name="theme-color" content="#0b0b0f">
<meta property="og:title" content="LOW CLASS UNIVERSE">
<meta property="og:description" content="จักรวาลเรื่องราวแนวซุปเปอร์ฮีโร่และวายร้ายสัญชาติไทยสไตล์ดาร์ก ดิบ เดือด">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c4213d%22/><text x=%2250%22 y=%2268%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial Black,Arial%22>LCU</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QQM1RFVD74"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-QQM1RFVD74');</script>
<style>
:root{--bg:#0b0b0f;--bg2:#121016;--card:#16121a;--line:#2e1c25;--line2:#4a1f2c;--acc:#c4213d;--acc2:#ff6b81;--tx:#ece6e8;--mut:#a9999e;--hd:'Kanit',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.75 'Sarabun',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--acc2);text-decoration:none}a:hover{text-decoration:underline}
img{max-width:100%;display:block}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-thumb{background:#3a1a24;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(11,11,15,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hw{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.logo{font:700 19px var(--hd);color:#fff;letter-spacing:1.5px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.logo b{background:var(--acc);color:#fff;font-size:13px;padding:2px 7px;border-radius:6px;letter-spacing:1px}
.logo:hover{text-decoration:none}
nav.main{display:flex;gap:0;margin-left:4px;flex-wrap:nowrap}
nav.main a,nav.main .dd>span{font:500 15px var(--hd);color:#cfc3c6;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;display:block}
nav.main a:hover,nav.main .dd:hover>span{background:#1b1419;color:#fff;text-decoration:none}
nav.main a.on{color:#fff;background:#2a0f18}
.dd{position:relative}
.dd .menu{display:none;position:absolute;top:100%;left:0;background:#141016;border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.dd:hover .menu,.dd:focus-within .menu{display:block}
.srch{margin-left:auto;position:relative}
.srch input{font:15px 'Sarabun',sans-serif;background:#141017;border:1px solid var(--line);border-radius:10px;color:#eee;padding:7px 12px 7px 34px;width:190px}
@media (max-width:1400px){.logo span{display:none}}
.srch input:focus{outline:none;border-color:var(--acc)}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
.burger{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer;margin-left:auto}

main{max-width:1240px;margin:0 auto;padding:0 20px 80px;min-height:70vh}
.crumbs{font:400 13px var(--hd);color:var(--mut);padding:18px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--mut)}.crumbs a:hover{color:#fff}
.crumbs span.sep{opacity:.5}
h1.pt{font:600 34px/1.3 var(--hd);color:#fff;margin:8px 0 18px;letter-spacing:.3px}
.ph{border-bottom:1px solid var(--line);margin:0 -20px 6px;padding:0 20px;background:radial-gradient(ellipse at 20% 0%,rgba(196,33,61,.16),transparent 60%)}
.ph .crumbs{padding-top:22px}.ph h1.pt{margin:6px 0 18px}
.banner{position:relative;margin:0 -20px;height:260px;overflow:hidden;border-bottom:1px solid var(--line)}
.banner img{width:100%;height:100%;object-fit:cover;opacity:.6}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,15,.1),var(--bg))}
.banner h1{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;font:700 40px/1.2 var(--hd);color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8);max-width:1200px;margin:0 auto}

/* content */
.sec{margin:22px 0}
.prose{max-width:860px}
.prose p{margin:0 0 .7em}
.prose p.c{text-align:center}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--hd);color:#fff;line-height:1.35;margin:1.1em 0 .45em}
.prose h1{font-size:28px}.prose h2{font-size:24px}.prose h3{font-size:20px}.prose h4{font-size:18px}
.prose > :first-child{margin-top:0}
.prose b{color:#fff;font-weight:600}
.prose ul,.prose ol{margin:0 0 .9em 1.4em}
.prose li{margin:.15em 0}
.prose li::marker{color:var(--acc)}
.split{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:32px;align-items:start}
.split .pic{position:sticky;top:76px}
.pic img,.gal img{border-radius:12px;border:1px solid var(--line);background:#111;width:100%;height:auto;cursor:zoom-in}
.gal{display:grid;gap:14px;grid-template-columns:repeat(var(--n,3),1fr)}
.gal.one{max-width:900px;margin:0 auto}
.gal.one img{cursor:zoom-in}

/* info box for character key facts */
.facts b{color:var(--acc2);font-weight:500;margin-right:4px}
.facts{background:linear-gradient(160deg,#18121a,#0f0d12);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.facts p{margin:.15em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{font:400 13px var(--hd);color:#e6d9dc;background:#141017;border:1px solid var(--line2);border-radius:20px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--acc);text-decoration:none;color:#fff}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lbl{font:500 13px var(--hd);color:var(--mut);margin-top:8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--tx);transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 28px rgba(196,33,61,.22);text-decoration:none}
.card .im{aspect-ratio:3/4;background:#0f0c10;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .im img{transform:scale(1.04)}
.card .nm{font:500 15px/1.35 var(--hd);color:#fff;padding:9px 11px 3px}
.card .sb{font-size:12px;color:var(--mut);padding:0 11px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.wide .card .im{aspect-ratio:16/10}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.toolbar input{font:15px 'Sarabun',sans-serif;background:#141017;border:1px solid var(--line);border-radius:10px;color:#eee;padding:8px 14px;flex:1 1 240px;max-width:380px}
.toolbar input:focus{outline:none;border-color:var(--acc)}
.count{font:400 13px var(--hd);color:var(--mut)}
.empty{color:var(--mut);padding:40px 0;text-align:center}

/* home */
.hero{position:relative;margin:0 -20px;min-height:430px;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(196,33,61,.25),transparent 60%),linear-gradient(to bottom,rgba(11,11,15,0) 30%,var(--bg))}
.hero .in{position:relative;z-index:2;padding:40px 20px 34px;max-width:1240px;margin:0 auto;width:100%}
.hero h1{font:700 56px/1.05 var(--hd);color:#fff;letter-spacing:2px;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.hero h1 span{color:var(--acc)}
.hero p{font-size:18px;color:#ddd;margin-top:10px;max-width:640px}
.hero .cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-block;font:500 16px var(--hd);color:#fff;background:var(--acc);border-radius:10px;padding:10px 22px;border:1px solid var(--acc)}
.btn:hover{text-decoration:none;filter:brightness(1.12)}
.btn.ghost{background:rgba(20,16,23,.7);border-color:var(--line2)}
.h2{font:600 24px var(--hd);color:#fff;margin:40px 0 14px;display:flex;align-items:center;gap:10px}
.h2:before{content:"";width:4px;height:22px;background:var(--acc);border-radius:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{display:block;color:var(--tx);background:linear-gradient(160deg,#18121a,#0f0d12);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.2s}
.tile:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 20px rgba(196,33,61,.25);text-decoration:none}
.tile .i{font-size:26px}.tile .t{font:500 18px var(--hd);color:#fff;margin:6px 0 2px}.tile .d{font-size:14px;color:var(--mut);line-height:1.5}
.tile .tag{display:inline-block;font-size:11px;color:var(--acc2);border:1px solid #5a1a28;border-radius:20px;padding:1px 8px;margin-top:8px}
.social{display:flex;gap:12px;flex-wrap:wrap}
.social a img{width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.tl{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:34px 18px;background:radial-gradient(ellipse at top,#3a0c18 0%,#0b0b0f 70%);border:1px solid #3a0f1a;border-radius:14px;color:#eee;transition:.2s;margin:10px 0 26px}
.tl:hover{border-color:var(--acc);box-shadow:0 0 24px rgba(196,33,61,.35);text-decoration:none}
.tl .t{font:600 26px var(--hd);color:#fff}.tl .d{font-size:15px;color:#b9a7ab;max-width:460px}
.tl .dots{display:flex;gap:6px}.tl .dots i{width:11px;height:11px;border-radius:50%}

footer{border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center;padding:26px 20px 40px}
footer a{color:var(--mut)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,5,8,.94);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.top-btn{position:fixed;right:18px;bottom:18px;z-index:40;background:#1a1218;border:1px solid var(--line2);color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;display:none}
.loading{padding:80px 0;text-align:center;color:var(--mut);font-family:var(--hd)}

@media (max-width:1060px){
  nav.main{display:none;position:absolute;top:100%;left:0;right:0;background:#0f0c11;border-bottom:1px solid var(--line);flex-direction:column;padding:10px 14px;margin:0}
  header.open nav.main{display:flex}
  .dd .menu{display:block;position:static;border:0;box-shadow:none;background:none;padding:0 0 0 14px}
  .burger{display:block}
  .srch{margin-left:0}
  .srch input{width:150px}
}
@media (max-width:700px){
  body{font-size:15.5px}
  .hw{padding:9px 16px;gap:10px}
  main{padding:0 16px 60px}
  .banner,.hero,.ph{margin-left:-16px;margin-right:-16px}.ph{padding:0 16px}
  .logo{font-size:16px}.logo span{display:none}
  .srch input{width:120px}
  .hero{min-height:340px}.hero h1{font-size:36px}.hero p{font-size:16px}
  .banner{height:170px}.banner h1{font-size:28px;left:16px}
  h1.pt{font-size:26px}
  .split{grid-template-columns:1fr;gap:16px}
  .split .pic{position:static;max-width:420px;margin:0 auto;width:100%}
  .gal{grid-template-columns:repeat(min(var(--n,3),2),1fr);gap:10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .grid.wide{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{padding:12px}.tile .d{display:none}.tile .t{font-size:16px}.tile .i{font-size:22px}
}
</style>
</head>
<body>
<header id="hdr"><div class="hw">
  <a class="logo" href="#/"><b>LCU</b><span>LOW CLASS UNIVERSE</span></a>
  <button class="burger" aria-label="เมนู" onclick="hdr.classList.toggle('open')">&#9776;</button>
  <nav class="main" id="nav"></nav>
  <form class="srch" onsubmit="event.preventDefault();go('/ค้นหา?q='+encodeURIComponent(this.q.value))">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input name="q" type="search" placeholder="ค้นหาทั้งเว็บ&#8230;" aria-label="ค้นหา">
  </form>
</div></header>
<main id="app"><div class="loading">กำลังโหลดจักรวาล&#8230;</div></main>
<footer>&#169; LOW CLASS UNIVERSE (LCU) &#183; ภาพประกอบบางส่วนสร้างด้วย AI &#183; <a href="https://palmer46.github.io/lcu-timeline/" target="_blank" rel="noopener">ไทม์ไลน์</a></footer>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img alt=""></div>
<button class="top-btn" id="topb" onclick="scrollTo(0,0)" aria-label="ขึ้นบนสุด">&#8593;</button>
<script>
const TIMELINE='https://palmer46.github.io/lcu-timeline/';
const HOME='/หนาแรก';
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s||'').replace(/<[^>]+>/g,'');
const DIA=new RegExp('['+String.fromCharCode(0xE31,0xE34)+'-'+String.fromCharCode(0xE3A,0xE47)+'-'+String.fromCharCode(0xE4E)+']','g');
const norm=s=>strip(s).toLowerCase().normalize('NFC').replace(DIA,'').replace(/\s+/g,'');
const EMO=new RegExp('^(\\p{Extended_Pictographic}['+String.fromCharCode(0xFE0F,0x200D)+'\\p{Extended_Pictographic}]*)\\s*(.*)$','u');
const emo=t=>{const m=t.match(EMO);return m?[m[1],m[2]]:['',t]};
const go=p=>{location.hash='#'+p};
const im=(s,cls='',alt='')=>s?`<img src="${s[0]}" width="${s[1]}" height="${s[2]}" loading="lazy" decoding="async" alt="${esc(alt)}"${cls?` class="${cls}"`:''}>`:'';
const title=p=>D.pages[p]?.title||(p==='/ค้นหา'?'ค้นหา':p.split('/').pop());
const isExt=h=>/^https?:/.test(h);

function navHTML(){
  return D.nav.map(n=>{
    const [e,t]=emo(n.t);const kids=n.c.filter(c=>!c.p.startsWith('/กลม-องคกร/'));
    if(n.p==='/เสนเวลา-เหตการณ')return `<a href="#${n.p}" data-p="${n.p}">${t}</a>`;
    if(kids.length)return `<div class="dd"><span>${t} &#9662;</span><div class="menu"><a href="#${n.p}" data-p="${n.p}">ทั้งหมด</a>${kids.map(c=>`<a href="#${c.p}" data-p="${c.p}">${emo(c.t)[1]}</a>`).join('')}</div></div>`;
    return `<a href="#${n.p===HOME?'/':n.p}" data-p="${n.p}">${t}</a>`;
  }).join('')+`<a href="${TIMELINE}" target="_blank" rel="noopener">ไทม์ไลน์ &#8599;</a>`;
}

function crumbs(p){
  const parts=p.split('/').filter(Boolean);let acc='';const out=[`<a href="#/">หน้าแรก</a>`];
  parts.forEach((x,i)=>{acc+='/'+x;out.push(i<parts.length-1&&D.pages[acc]?`<a href="#${acc}">${esc(title(acc))}</a>`:`<span>${esc(title(acc))}</span>`)});
  return `<div class="crumbs">${out.join('<span class="sep">&#8250;</span>')}</div>`;
}

const head=(p,t)=>`<div class="ph">${crumbs(p)}<h1 class="pt">${esc(t)}</h1></div>`;
/* ---------- generic section renderer ---------- */
function linkCard(b){
  const h=b.href;const ext=isExt(h);const t=h.startsWith('#/')?h.slice(1):null;
  const name=t&&D.pages[t]?title(t):'';
  return `<a class="card" href="${esc(h)}"${ext?' target="_blank" rel="noopener"':''}><div class="im">${im(b.src,'',name)}</div>${name?`<div class="nm">${esc(name)}</div>`:''}</a>`;
}
function blockHTML(b){
  switch(b.t){
    case 'h':return `<h${Math.min(b.l+1,4)}>${b.x}</h${Math.min(b.l+1,4)}>`;
    case 'p':return `<p${b.c?' class="c"':''}>${b.x}</p>`;
    case 'list':return `<${b.o?'ol':'ul'}>${b.items.map(i=>`<li>${i}</li>`).join('')}</${b.o?'ol':'ul'}>`;
    case 'img':return b.href?linkCard(b):`<div class="pic">${im(b.src,'z')}</div>`;
  }return '';
}
// merge a lone portrait section with the following text section; mark leading short "label value" lines as facts
function mergeLead(secs){
  const out=[];
  for(let i=0;i<secs.length;i++){
    const a=secs[i],b=secs[i+1];
    if(a.length===1&&a[0].t==='img'&&!a[0].href&&b&&b.length&&b.every(x=>x.t!=='img')){out.push([a[0],...b]);i++}
    else out.push(a);
  }
  return out;
}
function factsHTML(txt){
  let n=0;while(n<txt.length&&txt[n].t==='p'&&strip(txt[n].x).length<170&&/^\S{1,16}\s/.test(strip(txt[n].x)))n++;
  if(n<2)return txt.map(blockHTML).join('');
  const f=txt.slice(0,n).map(b=>`<p>${b.x.replace(/^((?:<[^>]+>)*)([^\s<]{1,16})(\s)/,'$1<b>$2</b>$3')}</p>`).join('');
  return `<div class="facts">${f}</div>`+txt.slice(n).map(blockHTML).join('');
}
function secHTML(s){
  const imgs=s.filter(b=>b.t==='img');const txt=s.filter(b=>b.t!=='img');
  // linked image grid with headings between (category style)
  if(imgs.length&&imgs.every(b=>b.href)&&txt.every(b=>b.t==='h'&&/<a /.test(b.x)||false)){
    if(!txt.length)return `<div class="sec grid${imgs.length<=3?' wide':''}">${imgs.map(linkCard).join('')}</div>`;
    // image + heading-link pairs &#8594; cards with the heading text as name
    return `<div class="sec grid wide">${imgs.map(linkCard).join('')}</div>`;
  }
  if(!txt.length){
    if(imgs.length===1)return `<div class="sec gal one">${im(imgs[0].src,'z')}</div>`;
    return `<div class="sec gal" style="--n:${Math.min(imgs.length,6)}">${imgs.map(b=>im(b.src,'z')).join('')}</div>`;
  }
  if(imgs.length===1&&s[0].t==='img'&&!imgs[0].href){
    return `<div class="sec split"><div class="pic">${im(imgs[0].src,'z')}</div><div class="prose">${factsHTML(txt)}</div></div>`;
  }
  return `<div class="sec prose">${s.every(b=>b.t!=='img')?factsHTML(s):s.map(blockHTML).join('')}</div>`;
}

/* ---------- character helpers ---------- */
const CH=()=>D.chars;
function charCard(c){
  const cat=title(c.cat);
  return `<a class="card" href="#${c.p}"><div class="im">${im(c.img,'',c.n)}</div><div class="nm">${esc(c.n)}</div><div class="sb">${esc(cat)}${c.tag?' &#183; '+esc(c.tag):''}</div></a>`;
}

function renderChars(cat){
  const cats=D.cats.filter(c=>D.pages[c]);
  const groups=[...new Set(CH().flatMap(c=>c.g))];
  const st={cat:cat||'',g:'',q:''};
  const pg=D.pages[cat||'/ตวละคร'];
  $('#app').innerHTML=`${head(cat||'/ตวละคร',cat?title(cat):'ตัวละคร')}
  <div class="toolbar"><input id="cq" type="search" placeholder="ค้นหาชื่อตัวละคร หรือคำในประวัติ&#8230;"><span class="count" id="cc"></span></div>
  <div class="lbl">ประเภท</div>
  <div class="chips" id="cf"><a class="chip" data-c="">ทั้งหมด</a>${cats.map(c=>`<a class="chip" data-c="${c}">${esc(title(c))}</a>`).join('')}</div>
  <details><summary class="lbl" style="cursor:pointer">กรองตามกลุ่ม / องค์กร</summary><div class="chips" id="gf"><a class="chip" data-g="">ทุกกลุ่ม</a>${groups.map(g=>`<a class="chip" data-g="${g}">${esc(title(g))}</a>`).join('')}</div></details>
  <div class="grid" id="cg" style="margin-top:14px"></div>`;
  const draw=()=>{
    const q=norm(st.q);
    const list=CH().filter(c=>(!st.cat||c.cat===st.cat)&&(!st.g||c.g.includes(st.g))&&(!q||norm(c.n+' '+c.q).includes(q)));
    $('#cg').innerHTML=list.length?list.map(charCard).join(''):`<div class="empty">ไม่พบตัวละคร</div>`;
    $('#cc').textContent=`${list.length} ตัวละคร`;
    document.querySelectorAll('#cf .chip').forEach(e=>e.classList.toggle('on',e.dataset.c===st.cat));
    document.querySelectorAll('#gf .chip').forEach(e=>e.classList.toggle('on',e.dataset.g===st.g));
  };
  $('#cf').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;st.cat=c.dataset.c;history.replaceState(null,'','#'+(st.cat||'/ตวละคร'));draw()};
  $('#gf').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;st.g=c.dataset.g;draw()};
  $('#cq').oninput=e=>{st.q=e.target.value;draw()};
  draw();
}

function renderGroups(){
  const pg=D.pages['/กลม-องคกร'];
  // card image for each group: linked image on the groups index page, fallback: first image on group page
  const cardImg={};pg.secs.flat().forEach(b=>{if(b.t==='img'&&b.href?.startsWith('#/'))cardImg[b.href.slice(1)]??=b.src});
  const items=D.groups.map(g=>({p:g,n:title(g),img:cardImg[g]||D.pages[g].secs.flat().find(b=>b.t==='img')?.src,m:CH().filter(c=>c.g.includes(g)).length}));
  $('#app').innerHTML=`${head('/กลม-องคกร','กลุ่ม & องค์กร')}
  <div class="toolbar"><input id="gq" type="search" placeholder="ค้นหากลุ่ม / องค์กร&#8230;"><span class="count" id="gc"></span></div>
  <div class="grid wide" id="gg"></div>`;
  const draw=q=>{q=norm(q);const l=items.filter(i=>!q||norm(i.n).includes(q));$('#gg').innerHTML=l.map(i=>`<a class="card" href="#${i.p}"><div class="im">${im(i.img,'',i.n)}</div><div class="nm">${esc(i.n)}</div><div class="sb">${i.m?i.m+' สมาชิกที่มีหน้า':'&nbsp;'}</div></a>`).join('');$('#gc').textContent=l.length+' กลุ่ม'};
  $('#gq').oninput=e=>draw(e.target.value);draw('');
}

function renderHome(){
  const pg=D.pages[HOME];const s=pg.secs;
  const intro=s.find(x=>x.some(b=>b.t==='h'&&/สารานุกรม/.test(b.x)))||[];
  const socialSec=s.find(x=>x.length&&x.every(b=>b.t==='img'&&b.href&&isExt(b.href)));
  const rest=s.filter(x=>x!==intro&&x!==socialSec&&!(x.length===1&&x[0].t==='h'&&/โซเชียล/.test(x[0].x)));
  const tiles=[['&#129516;','ตัวละคร','มนุษย์ อมนุษย์ ปีศาจ เทพ และสิ่งมีชีวิตหิมพานต์','/ตวละคร',CH().length+' ตัวละคร'],['&#127917;','กลุ่ม & องค์กร','แก๊ง หน่วยข่าวกรอง อิลลูมินาติ Midnight Lust','/กลม-องคกร',D.groups.length+' กลุ่ม'],['&#9881;&#65039;','เทคโนโลยี & อาวุธ','อาวุธ ยุทโธปกรณ์ และนวัตกรรมในจักรวาล','/เทคโนโลย-อาวธ'],['&#128220;','เส้นเวลา & เหตุการณ์','ลำดับเหตุการณ์สำคัญของ LCU','/เสนเวลา-เหตการณ'],['&#127756;','โลกหิมพานต์','ดินแดนแห่งสัตว์ในตำนานและเมืองบาดาล','/ตางโลก/โลกหมพานต'],['&#127767;','สวรรค์ & นรก','ชั้นฟ้า ชั้นนรก และผู้ปกครองแต่ละดินแดน','/ตางโลก/สวรรค-นรก']];
  const feat=CH().filter(c=>c.img&&c.cat==='/ตวละคร/มนษย').slice(0,6).concat(CH().filter(c=>c.img&&c.cat==='/ตวละคร/ปศาจ-เทพ').slice(0,6));
  $('#app').innerHTML=`<section class="hero">${im(pg.banner)}<div class="in"><h1>LOW CLASS<br><span>UNIVERSE</span></h1><p>จักรวาลเรื่องราวแนวซุปเปอร์ฮีโร่และวายร้ายสัญชาติไทย สไตล์ดาร์ก ดิบ เดือด</p><div class="cta"><a class="btn" href="#/ตวละคร">สำรวจตัวละคร</a><a class="btn ghost" href="${TIMELINE}" target="_blank" rel="noopener">เปิดไทม์ไลน์ &#8599;</a></div></div></section>
  <div class="h2">สำรวจจักรวาล LCU</div>
  <div class="tiles">${tiles.map(t=>`<a class="tile" href="#${t[3]}"><div class="i">${t[0]}</div><div class="t">${t[1]}</div><div class="d">${t[2]}</div>${t[4]?`<span class="tag">${t[4]}</span>`:''}</a>`).join('')}</div>
  <div class="h2">ตัวละครเด่น</div>
  <div class="grid">${feat.map(charCard).join('')}</div>
  <div style="margin-top:14px"><a class="btn ghost" href="#/ตวละคร">ดูตัวละครทั้งหมด &#8594;</a></div>
  <div class="h2">เกี่ยวกับ LCU</div>
  <div class="sec prose">${intro.filter(b=>!(b.t==='h')).map(blockHTML).join('')}</div>
  ${rest.map(secHTML).join('')}
  ${socialSec?`<div class="h2">โซเชียล</div><div class="social">${socialSec.map(b=>`<a href="${esc(b.href)}" target="_blank" rel="noopener">${im(b.src)}</a>`).join('')}</div>`:''}`;
}

function renderPage(p){
  const pg=D.pages[p];
  if(!pg){$('#app').innerHTML=`${head('/','ไม่พบหน้านี้')}<p><a href="#/">กลับหน้าแรก</a></p>`;return}
  const ch=CH().find(c=>c.p===p);
  let secs=pg.secs.slice();
  // drop a heading-only first section that just repeats the title
  if(secs[0]?.length===1&&secs[0][0].t==='h'&&norm(secs[0][0].x)===norm(pg.title))secs.shift();
  let extra='';
  if(ch){
    const g=ch.g.map(x=>`<a class="chip" href="#${x}">${esc(title(x))}</a>`).join('');
    const cat=`<a class="chip" href="#${ch.cat}">${esc(title(ch.cat))}</a>`;
    extra=`<div class="chips">${cat}${ch.tag?`<span class="chip">${esc(ch.tag)}</span>`:''}${g}</div>`;
  }
  // backlinks: pages that link here
  const back=Object.entries(D.pages).filter(([k,v])=>k!==p&&k!==pg.parent&&JSON.stringify(v.secs).includes(`"#${p}"`)||false).map(([k])=>k).filter(k=>!D.cats.includes(k)&&k!=='/ตวละคร');
  const backHTML=back.length?`<div class="h2">ถูกกล่าวถึงใน</div><div class="chips">${back.map(k=>`<a class="chip" href="#${k}">${esc(title(k))}</a>`).join('')}</div>`:'';
  let tl='';
  if(p==='/เสนเวลา-เหตการณ'){
    secs=secs.filter(s=>!(s.length===1&&s[0].t==='h'&&/TIMELINE/i.test(s[0].x)));
    tl=`<a class="tl" href="${TIMELINE}" target="_blank" rel="noopener"><div style="font-size:42px">&#9203;</div><div class="t">TIMELINE LCU</div><div class="d">เหตุการณ์ทั้งจักรวาล เรียงตามเวลาหรือตามเรื่อง กรองตามซีรีส์ และค้นหาได้</div><div class="dots">${['#4ea8ff','#3ecf8e','#a77bff','#ff4d5e','#f5c518','#ff7ac8','#f2f2f2'].map(c=>`<i style="background:${c}"></i>`).join('')}</div><span class="btn">เปิดไทม์ไลน์ &#8594;</span></a>`;
  }
  if(p==='/ตางโลก/สวรรค-นรก'){
    const T=[['&#127963;&#65039;','3 เสาหลักแห่งนรก','ซิซ ลิเวียธาน เบเฮโมท &#8212; สิ่งมีชีวิตดึกดำบรรพ์ที่แข็งแกร่งกว่าซาตาน ไม่มีราชาองค์ใดสั่งการได้','เหนือทุกอำนาจ','/กลม-องคกร/3-เสาหลกแหงนรก'],['&#128520;','ซาตาน','ราชาแห่งนรก บาปแห่งโทสะ ผู้ชนะสงครามนรกชั้นที่ 5','ราชา','/ตวละคร/ปศาจ-เทพ/ซาตาน-บาปแหงโทสะ'],['&#128293;','มหาบาป 7 ประการ','ปีศาจตัวแทนบาปทั้งเจ็ด ตั้งแต่โทสะจนถึงเกียจคร้าน','บาป','/กลม-องคกร/มหาบาป-7-ประการ'],['&#128081;','4 ราชินีแห่งปีศาจ','ลิลิธ อากรัท บัท มาห์ลัต นาอามาห์ และไอเช็ธ เซนูนิม','ราชินี','/กลม-องคกร/4-ราชนแหงปศาจ'],['&#9939;&#65039;','เดียโบล','อดีตบาปแห่งโทสะ ผู้แพ้สงครามและถูกเนรเทศสู่โลกันตนรก','ผู้ถูกเนรเทศ','/ตวละคร/ปศาจ-เทพ/เดยโบล'],['&#127769;','Midnight Lust','อาณาจักรของปีศาจราคะที่แฝงตัวอยู่ในโลกมนุษย์','โลกมนุษย์','/กลม-องคกร/midnight-lust']];
    tl=`<div class="h2">&#128293; ขั้วอำนาจแห่งนรก</div><div class="tiles" style="margin-bottom:20px">${T.map(t=>`<a class="tile" href="#${t[4]}"><div class="i">${t[0]}</div><div class="t">${t[1]}</div><div class="d">${t[2]}</div><span class="tag">${t[3]}</span></a>`).join('')}</div>`;
  }
  secs=mergeLead(secs);
  $('#app').innerHTML=`${head(p,pg.title)}${extra}${tl}${secs.map(secHTML).join('')}${backHTML}`;
}

function renderSearch(q){
  const nq=norm(q);const res=[];
  if(nq)for(const [k,v] of Object.entries(D.pages)){
    const txt=v.secs.flat().map(b=>strip(b.x||'')+' '+(b.items||[]).map(strip).join(' ')).join(' ');
    const inT=norm(v.title).includes(nq);const i=norm(txt).includes(nq);
    if(inT||i){
      // snippet
      const low=txt.toLowerCase();let at=low.indexOf(q.toLowerCase());const snip=at>=0?txt.slice(Math.max(0,at-60),at+120):txt.slice(0,160);
      res.push({k,v,score:inT?2:1,snip});
    }
  }
  res.sort((a,b)=>b.score-a.score);
  $('#app').innerHTML=`${head('/ค้นหา','ค้นหา: "'+q+'"')}<div class="count">${res.length} ผลลัพธ์</div>
  <div style="margin-top:14px;display:grid;gap:10px">${res.map(r=>{const c=CH().find(x=>x.p===r.k);const img=c?.img||r.v.secs.flat().find(b=>b.t==='img')?.src;return `<a class="tile" href="#${r.k}" style="display:flex;gap:14px;align-items:center">${img?`<div style="flex:0 0 64px;height:64px;border-radius:8px;overflow:hidden">${im(img).replace('<img','<img style="width:100%;height:100%;object-fit:cover"')}</div>`:''}<div><div class="t" style="margin:0">${esc(r.v.title)}</div><div class="d">${esc(r.snip)}&#8230;</div></div></a>`}).join('')||'<div class="empty">ไม่พบผลลัพธ์</div>'}</div>`;
}

function route(){
  let h=decodeURIComponent(location.hash.slice(1)||'/');
  hdr.classList.remove('open');
  const [p,qs]=h.split('?');
  document.querySelectorAll('#nav a[data-p]').forEach(a=>{const dp=a.dataset.p;a.classList.toggle('on',p===dp||(dp!==HOME&&p.startsWith(dp+'/'))||(dp===HOME&&p==='/'))});
  if(p==='/'||p===HOME)renderHome();
  else if(p==='/ตวละคร'||D.cats.includes(p))renderChars(p==='/ตวละคร'?'':p);
  else if(p==='/กลม-องคกร')renderGroups();
  else if(p==='/ค้นหา')renderSearch(new URLSearchParams(qs).get('q')||'');
  else renderPage(p);
  document.querySelectorAll('#app a[href^="http"]').forEach(x=>{x.target='_blank';x.rel='noopener'});
  const t=p==='/'||p===HOME?'':(p==='/ค้นหา'?'ค้นหา':title(p));
  document.title=(t?t+' | ':'')+'LOW CLASS UNIVERSE';
  scrollTo(0,0);
  if(window.gtag)gtag('event','page_view',{page_path:'/'+p,page_title:document.title});
}
document.addEventListener('click',e=>{
  const z=e.target.closest('img.z,.gal img,.pic img');
  if(z&&!z.closest('a')){$('#lb img').src=z.src;$('#lb').classList.add('on')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});
addEventListener('scroll',()=>{topb.style.display=scrollY>800?'block':'none'},{passive:true});
fetch('data.json').then(r=>r.json()).then(d=>{D=d;$('#nav').innerHTML=navHTML();addEventListener('hashchange',route);route()})
 .catch(e=>{$('#app').innerHTML='<div class="loading">โหลดข้อมูลไม่สำเร็จ &#8212; ลองรีเฟรชอีกครั้ง</div>'});
</script>
